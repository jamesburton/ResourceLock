name: Publish NuGet Tool Package

# ==============================================================================
# NuGet Trusted Publishing & Prefix Reservation Workflow
# ==============================================================================
# This GitHub Actions workflow builds, tests, packs, and publishes the ResourceLock
# .NET Global Tool to NuGet.org using NuGet Trusted Publishing (OpenID Connect / OIDC).
#
# NuGet Package Prefix Reservation:
#   Pattern: ResourceLock*
#   - Reserved on NuGet.org under Account Settings > Package Prefix Reservation.
#   - Grants the verified checkmark badge on NuGet and reserves all package IDs
#     beginning with the 'ResourceLock' prefix (e.g., ResourceLock, ResourceLock.Core).
#
# NuGet Trusted Publisher Setup (on https://www.nuget.org):
#   1. Sign in to NuGet.org and navigate to Account Settings -> Trusted Publishing.
#   2. Add a new trusted publisher with:
#        - Publisher Type: GitHub Actions
#        - Repository Owner: <GitHub Org or Username> (e.g., jamesburton)
#        - Repository Name: ResourceLock
#        - Workflow Name: publish.yml
#        - Package Pattern: ResourceLock*
#   3. GitHub Actions authenticates passwordlessly via OIDC tokens exchanged
#      via the NuGet/login action (no long-lived API keys stored in secrets).
# ==============================================================================

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Build, Pack & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore ResourceLock.sln

      - name: Run solution tests
        run: dotnet test ResourceLock.sln --configuration Release --no-restore

      - name: Pack packages
        run: dotnet pack --configuration Release --output ./nupkg

      - name: NuGet Login (OIDC Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USERNAME || github.repository_owner }}

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}" --skip-duplicate
